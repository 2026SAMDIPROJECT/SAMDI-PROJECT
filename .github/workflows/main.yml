name: Actions 😎

on: [push, pull_request]

# 저장소 전체에서 동시에 하나의 워크플로만 돌도록 제한 (학생 라이선스 보호)
concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build Project by Platform :: ${{matrix.targetPlatform}} ✨"
    runs-on: ${{ matrix.buildOs }}
    
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            buildOs: ubuntu-latest
          - targetPlatform: StandaloneOSX
            buildOs: macos-latest
          - targetPlatform: WebGL
            buildOs: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Cache
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      # 3. Test (Windows 빌드 작업에서만 테스트 수행)
      - name: Run tests
        if: matrix.targetPlatform == 'StandaloneWindows64'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}

      # 5. Output
      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
