name: Build Unity Project (Windows)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildForWindows:
    name: Build for Windows 🖥️
    runs-on: ubuntu-latest
    
    # [수정] 기존 시리얼 체크 대신 새 Personal 라이선스 정보를 레벨 env로 등록합니다.
    env:
      CHECK_LICENSE: ${{ secrets.UNITY_LICENSE }}
      CHECK_EMAIL: ${{ secrets.UNITY_EMAIL }}
      CHECK_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. 유니티 Library 폴더 캐싱
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-

      # 3. GameCI를 이용한 Windows 64비트 빌드
      - name: Run Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.CHECK_LICENSE }} # [수정] 시리얼 대신 .ulf 라이선스 주입
          UNITY_EMAIL: ${{ env.CHECK_EMAIL }}
          UNITY_PASSWORD: ${{ env.CHECK_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64

      # 4. 빌드 결과물(Artifact) 저장 공식 플러그인
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build/StandaloneWindows64
