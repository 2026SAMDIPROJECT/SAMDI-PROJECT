name: Unity - License Activation

# GitHub 웹사이트에서 개발자가 수동으로 버튼을 눌러 실행할 수 있도록 설정합니다.
on: 
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file (.alf)
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드를 가상 환경으로 가져옵니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 유니티 수동 인증에 필요한 .alf 파일을 생성합니다.
      - name: Request manual activation file
        uses: game-ci/unity-request-activation-file@v2
        id: scratchpad

      # 3. 생성된 .alf 파일을 깃허브 웹에서 다운로드할 수 있도록 아티팩트로 업로드합니다.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Manual_Activation_File
          path: ${{ steps.scratchpad.outputs.filePath }}
